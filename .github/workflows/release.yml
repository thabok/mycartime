name: Build desktop app

# Nuitka cannot cross-compile, so each OS builds its own sidecar and installer.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Write .env for the backend build
        shell: bash
        run: echo "GITHUB_ISSUE_CREATION=${{ secrets.ISSUE_CREATION_TOKEN }}" > .env

      # Nuitka's compilation cache (see below) relies on a compiler cache to
      # skip recompiling unchanged object files. On Windows it uses its own
      # bundled copy of clcache, but on macOS it needs ccache installed
      # separately.
      - name: Install ccache
        if: runner.os == 'macOS'
        run: brew install ccache

      # Nuitka translates every followed module (the app plus the pure-Python
      # parts of its dependencies - flask, cryptography's wrapper,
      # ortools' Python layer, the stdlib closure, ...) to C and compiles it;
      # it caches those object files (via a bundled ccache) keyed by
      # preprocessed source content, so an unchanged dependency module is a
      # cache hit even after app.py changes. That cache lives under
      # NUITKA_CACHE_DIR, which defaults to a per-user directory that doesn't
      # survive between fresh runner VMs - pinning it to a path inside the
      # workspace lets actions/cache persist it, so only modules that actually
      # changed get recompiled instead of the whole dependency closure every
      # release.
      - name: Restore Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'webuntis/**') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build the backend sidecar
        shell: bash
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ./webuntis
          pip install nuitka
          bash backend/build_sidecar.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build the app bundle
        # Unsigned build (no Apple developer account) - macOS Gatekeeper will warn on first run.
        run: npm run build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
