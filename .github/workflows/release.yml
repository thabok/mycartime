name: Build desktop app

# Nuitka cannot cross-compile, so each OS builds its own sidecar and installer.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Write .env for the backend build
        shell: bash
        run: echo "GITHUB_ISSUE_CREATION=${{ secrets.ISSUE_CREATION_TOKEN }}" > .env

      # Nuitka's compilation cache (see below) relies on a compiler cache to
      # skip recompiling unchanged object files. On Windows it uses its own
      # bundled copy of clcache, but on macOS it needs ccache installed
      # separately.
      - name: Install ccache
        if: runner.os == 'macOS'
        run: brew install ccache

      # Nuitka translates every followed module (the app plus the pure-Python
      # parts of its dependencies - flask, cryptography's wrapper,
      # ortools' Python layer, the stdlib closure, ...) to C and compiles it;
      # it caches those object files (via a bundled ccache) keyed by
      # preprocessed source content, so an unchanged dependency module is a
      # cache hit even after app.py changes. That cache lives under
      # NUITKA_CACHE_DIR, which defaults to a per-user directory that doesn't
      # survive between fresh runner VMs - pinning it to a path inside the
      # workspace lets actions/cache persist it, so only modules that actually
      # changed get recompiled instead of the whole dependency closure every
      # release.
      - name: Restore Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('src/backend/requirements.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build the backend sidecar
        shell: bash
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install nuitka
          bash src/backend/build_sidecar.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Install JS dependencies
        run: |
          npm --prefix src ci
          npm --prefix src/frontend ci

      # Tauri copies the Nuitka dist into target/<target>/release/backend as a
      # bundle resource, but it only ever adds/overwrites - it never removes
      # files that have since disappeared from the source. The rust-cache step
      # above persists this target/ dir across workflow runs keyed on Rust
      # files, not src/backend/requirements.txt, so a package dropped from the
      # backend can linger here indefinitely and still get shipped. A leftover
      # numexpr tree (from before it left the dependency set) made pandas -
      # imported by ortools' cp_model - die at import with "Can't determine
      # version for numexpr", taking the whole backend down, even though the
      # freshly built dist had no numexpr at all. Wipe the staged copy so the
      # bundle can only ever contain what this build actually produced.
      - name: Remove stale staged backend resources
        shell: bash
        run: rm -rf "src/src-tauri/target/${{ matrix.target }}/release/backend"

      - name: Build the app bundle
        run: npm run build -- --target ${{ matrix.target }}
        working-directory: src

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
